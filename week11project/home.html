<!DOCTYPE html>
<html lang="en-us">

<head>
	
	<meta charset="UTF-8">
    <meta name="viewport" content="wdith=device-width, initial-scale-1.0">
	
	<link href="style.css" rel="stylesheet" type="text/css">
	
	<!--Anthony Denney | 19/04/2026-->
	
	<title>Contact Us</title>
	
</head>

<body>

	<h3>Contact Our Team</h3>
	<p>Please complete the form below and we'll get back to you as soon as possible.</p>

	<form action="https://webdevbasics.net/scripts/demo.php" method="post">

		<label for="fullname">Full Name:</label>
		<input type="text" id="fullname" name="fullname" required>
	
		<label for="email">Email Address:</label>
		<input type="email" id="email" name="email" required>
	
		<label for="phone">Phone Number:</label>
		<input type="tel" id="phone" name="phone">
	
		<label for="topic">Topic:</label>
		<select id="topic" name="topic">
	
			<option value="general">General Inquiry</option>
			<option value="support">Support</option>
			<option value="feedback">Feedback</option>
		
		</select>
	
		<label for="message">Message:</label>
		<textarea id="message" required name="message"></textarea>
	
		<button type="submit">Send Message</button>
	
	</form>

	<p><a href="../index.html">Back to Web110 Assignments</a></p>
</body>
